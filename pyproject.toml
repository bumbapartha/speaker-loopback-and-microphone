[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-capture-windows"
version = "0.1.0"
description = "Explicitly controlled Windows microphone and playback-loopback capture"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyAudioWPatch==0.2.12.9",
    "numpy==2.5.5",
    "soxr==1.1.0",
]

[project.scripts]
capture-agent = "capture_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

